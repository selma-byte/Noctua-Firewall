[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "noctua-firewall"
version = "0.1.0"
description = "Rule-based packet filter that compiles YAML rules into nftables"
requires-python = ">=3.9"
dependencies = ["pyyaml"]

[project.scripts]
noctua = "noctua.cli:main"

[tool.setuptools]
packages = ["noctua"]